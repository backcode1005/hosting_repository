<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>야간 근무 체크리스트</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 10mm;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
      background-color: #ffffff;
      color: #000000;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      border: 2px solid #000000;
      padding: 25px 30px;
    }
    
    /* 상단 헤더 & 결재란 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #000000;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: -1px;
    }
    .info-table {
      border-collapse: collapse;
    }
    .info-table th, .info-table td {
      border: 1px solid #000000;
      padding: 5px 10px;
      font-size: 13px;
      text-align: center;
      white-space: nowrap;
    }
    .info-table th {
      background-color: #f2f2f2;
      font-weight: bold;
    }

    /* 본문 영역 스타일 */
    .section {
      border: 1px solid #000000;
      margin-bottom: 15px;
    }
    .section-header {
      background-color: #f2f2f2;
      border-bottom: 1px solid #000000;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: bold;
    }
    .task-group {
      padding: 10px 15px;
    }
    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px dotted #dddddd;
    }
    .task-item:last-child {
      border-bottom: none;
    }

    /* CSS 체크박스 & 취소선 처리 */
    .chk {
      width: 16px;
      height: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chk-label {
      font-size: 14px;
      cursor: pointer;
    }
    .chk:checked + .chk-label {
      text-decoration: line-through;
      color: #777777;
    }

    /* 주의사항 강조 스타일 */
    .warning-box {
      background-color: #fff0f0;
      border-left: 3px solid #d32f2f;
      padding: 4px 8px;
      margin: 4px 0 4px 24px;
      font-size: 13px;
      color: #d32f2f;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 영역 -->
    <div class="header">
      <div class="title">야간 근무 체크리스트</div>
      <table class="info-table">
        <tr>
          <th>작성일자</th>
          <td>2026-11-05</td>
          <th>근무조</th>
          <td>야간 (23:00~07:00)</td>
          <th>근무자</th>
          <td>유호진</td>
        </tr>
      </table>
    </div>

    <!-- 본문 영역 -->
    <div>
      
      <!-- 출근 및 시작 -->
      <div class="section">
        <div class="section-header">출근 및 시작</div>
        <div class="task-group">
          <div class="task-item">
            <input type="checkbox" id="t1" class="chk">
            <label for="t1" class="chk-label">인수인계 및 시제 점검 (포스기 현금/수표 확인)</label>
          </div>
        </div>
      </div>

      <!-- 주류 및 폐기 -->
      <div class="section">
        <div class="section-header">주류 및 폐기</div>
        <div class="task-group">
          <div class="task-item">
            <input type="checkbox" id="t2" class="chk">
            <label for="t2" class="chk-label">술 재고 확인 (1박스 = 20개)</label>
          </div>
          <div class="task-item">
            <input type="checkbox" id="t3" class="chk">
            <label for="t3" class="chk-label">폐기 확인</label>
          </div>
          <div class="warning-box">
            ※ 주의: 등록 없이 영수증만 뽑고 음식물로 버리기
          </div>
        </div>
      </div>

      <!-- 쓰레기, 담배 및 봉투 -->
      <div class="section">
        <div class="section-header">쓰레기, 담배 및 봉투</div>
        <div class="task-group">
          <div class="task-item">
            <input type="checkbox" id="t4" class="chk">
            <label for="t4" class="chk-label">음식물 쓰레기: 매일 배출 (폐기 상품 포함)</label>
          </div>
          <div class="task-item">
            <input type="checkbox" id="t5" class="chk">
            <label for="t5" class="chk-label">일반 쓰레기: 가득 차면 배출</label>
          </div>
          <div class="warning-box">
            ※ 주의: 냄새나는 경우 연락 후 배출
          </div>
          <div class="task-item">
            <input type="checkbox" id="t6" class="chk">
            <label for="t6" class="chk-label">담배 재고 확인 및 부족분 채우기 (1보루 = 10개)</label>
          </div>
          <div class="warning-box">
            ※ 주의: 보루 판매 시 라이터 증정 + 영수증 필수
          </div>
          <div class="task-item">
            <input type="checkbox" id="t7" class="chk">
            <label for="t7" class="chk-label">봉투류 재고 확인 (한묶음 = 10매)</label>
          </div>
        </div>
      </div>

      <!-- 매장 청소 및 냉장 식품 점검 -->
      <div class="section">
        <div class="section-header">매장 청소 및 냉장 식품 점검</div>
        <div class="task-group">
          <div class="task-item">
            <input type="checkbox" id="t8" class="chk">
            <label for="t8" class="chk-label">청소: 매장 바닥 + 작은 테이블/얼음컵/병음료 아래 쓸고 닦기</label>
          </div>
          <div class="task-item">
            <input type="checkbox" id="t9" class="chk">
            <label for="t9" class="chk-label">냉동식품 유통기한 점검</label>
          </div>
        </div>
      </div>

      <!-- 상시 업무 -->
      <div class="section">
        <div class="section-header">상시 업무</div>
        <div class="task-group">
          <div class="task-item">
            <input type="checkbox" id="t10" class="chk">
            <label for="t10" class="chk-label">술 채우기: 팔리면 바로바로 채워넣기</label>
          </div>
          <div class="task-item">
            <input type="checkbox" id="t11" class="chk">
            <label for="t11" class="chk-label">냉장식품 앞으로 당기기: 빈자리 수시로 채우기</label>
          </div>
          <div class="task-item">
            <input type="checkbox" id="t12" class="chk">
            <label for="t12" class="chk-label">아이스크림 관리: 팔리면 바로 채우고, 문 열려 있으면 꼭 닫기</label>
          </div>
          <div class="task-item">
            <input type="checkbox" id="t13" class="chk">
            <label for="t13" class="chk-label">온장고 관리: 온장 음료 채우고 문 꼭 닫기</label>
          </div>
          <div class="task-item">
            <input type="checkbox" id="t14" class="chk">
            <label for="t14" class="chk-label">모기 잡기: 매장 내 모기 수시로 퇴치</label>
          </div>
          <div class="task-item">
            <input type="checkbox" id="t15" class="chk">
            <label for="t15" class="chk-label">빈병 수거: 영수증 발행 + 돈 지급 + 병 정리</label>
          </div>
        </div>
      </div>

      <!-- 마무리 업무 (06:30~) -->
      <div class="section">
        <div class="section-header">마무리 업무 (06:30 ~)</div>
        <div class="task-group">
          <div class="task-item">
            <input type="checkbox" id="t16" class="chk">
            <label for="t16" class="chk-label">담배 채운 것 최종 확인</label>
          </div>
          <div class="task-item">
            <input type="checkbox" id="t17" class="chk">
            <label for="t17" class="chk-label">술 채운 것 최종 확인</label>
          </div>
          <div class="task-item">
            <input type="checkbox" id="t18" class="chk">
            <label for="t18" class="chk-label">라면 물품 채운 것 최종 확인</label>
          </div>
          <div class="task-item">
            <input type="checkbox" id="t19" class="chk">
            <label for="t19" class="chk-label">냉장식품 앞으로 잘 꺼내져 있는지(전면 진열) 최종 확인</label>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
